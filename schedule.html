
<!DOCTYPE html>

<header class="header">

<nav>

<main class="container">
<h1>📅 我的課程管理</h1>
<p>把每天的課程安排好，讓生活更有規律！</p>

<section class="panel">
<h3>新增課程</h3>
<form id="courseForm">
<label>課程名稱</label>
<input id="courseName" placeholder="例如：資料庫系統" required>

<label>星期</label>
<select id="courseDay">
<option>星期一</option><option>星期二</option>
<option>星期三</option><option>星期四</option>
<option>星期五</option><option>星期六</option>
<option>星期日</option>
</select>

<label>上課時間</label>
<input id="courseTime" type="time" required>

<label>教室</label>
<input id="courseRoom" placeholder="例如：資電大樓 301">

<button type="submit">新增課程</button>
</form>
</section>

<section class="panel">
<h3>課程清單</h3>
<div id="courseList"></div>
</section>
</main>

<footer>大學生生活小管家 💜</footer>
<script src="../js/schedule.js"></script>
</body>
</html>
